services:
  - type: web
    name: photo-album
    env: python
    plan: free
    buildCommand: 'pip install -r requirements.txt && python manage.py collectstatic --no-input'
    preDeployCommand: 'python manage.py migrate --no-input'
    startCommand: 'gunicorn photo_album.wsgi:application'
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: photo_album.settings
      - key: DEBUG
        value: '0'
      - key: SECRET_KEY
        generator: secret
      - key: DATABASE_URL
        fromDatabase:
          name: photo-album-db
          databaseName: postgres
          property: connectionString

databases:
  - name: photo-album-db
    plan: free
