services:
  - type: web
    name: photo-album
    env: python
    plan: free
    buildCommand: 'pip install -r requirements.txt'
    startCommand: 'gunicorn photo_album.wsgi'
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: photo_album.settings
      - key: SECRET_KEY
        generator: secret
      - key: DATABASE_URL
        fromDatabase:
          name: photo-album-db
          databaseName: postgres
      # Add CLOUDINARY_URL in the Render service environment variables to enable Cloudinary media storage.
