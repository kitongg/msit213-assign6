{% extends 'base.html' %}
{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Albums</h2>
        <a class="btn btn-primary" href="{% url 'albums:album-add' %}">Add album</a>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        {% for album in albums %}
        <div class="col">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title"><a href="{{ album.get_absolute_url }}">{{ album.title }}</a></h5>
                    <p class="card-text text-muted mb-2">{% if album.owner %}by {{ album.owner }}{% else %}by Anonymous{% endif %}</p>
                    <div class="mt-auto">
                        <a class="btn btn-outline-secondary btn-sm me-2" href="{% url 'albums:album-edit' album.pk %}">Edit</a>
                        <a class="btn btn-outline-danger btn-sm" href="{% url 'albums:album-delete' album.pk %}">Delete</a>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">No albums yet.</div>
        {% endfor %}
    </div>
{% endblock %}
