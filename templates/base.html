{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Photo Album</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="{% static 'css/bootstrap-override.css' %}" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="/">Photo Album</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarMain">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    </ul>
                    <div class="d-flex align-items-center">
                        {% if user.is_authenticated %}
                            <span class="text-white me-3">{{ user.username }}</span>
                            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'logout' %}">Log out</a>
                        {% else %}
                            <a class="btn btn-light btn-sm me-2" href="{% url 'login' %}">Log in</a>
                            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'albums:register' %}">Register</a>
                        {% endif %}
                        <a class="btn btn-outline-light btn-sm" href="/admin/">Admin</a>
                    </div>
                </div>
            </div>
        </nav>

        <main class="py-4">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- footer removed as requested -->

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
